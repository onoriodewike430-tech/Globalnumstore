<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobalNum Admin Login</title><style>body{font-family:Arial,sans-serif;background:#111;margin:0;display:grid;place-items:center;min-height:100vh;color:#fff}.card{background:#1f1f1f;padding:28px;border-radius:16px;box-shadow:0 10px 30px #0008;width:min(92%,380px)}h1{margin-top:0}input,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:9px;border:1px solid #666;font-size:16px}input{background:#3a3a3a;color:#fff}button{background:#111827;color:#fff;border:0;cursor:pointer}.hint{font-size:13px;color:#ddd;background:#292929;padding:10px;border-radius:8px}.msg{margin-top:10px;font-size:14px;color:#ffb4b4}</style></head><body><div class="card"><h1>Admin Login</h1><p>Browser demo version</p><input id="u" value="admin" placeholder="Username"><input id="p" value="GlobalNumDemo123!" type="password" placeholder="Password"><button onclick="login()">Sign in</button><div class="hint">Test username: <b>admin</b><br>Test password: <b>GlobalNumDemo123!</b></div><div id="m" class="msg"></div></div><script>function login(){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value,m=document.getElementById('m');if(u==='admin'&&p==='GlobalNumDemo123!'){localStorage.setItem('demoAdmin','1');location.href='admin.html';}else m.textContent='Wrong username or password.';}</script></body></html>
